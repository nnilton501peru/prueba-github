<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Enlaces v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,sans-serif;}
body{background:#000;color:#fff;min-height:100vh;padding:1.5rem 1rem;}

#linternaOverlay{display:none;position:fixed;inset:0;background:#fff;z-index:99999;cursor:pointer;}

/* MENU */
.menu-container{position:fixed;top:15px;right:15px;z-index:10000;}
.menu-btn{background:#1a0a00;color:#ff9900;border:1px solid #ff9900;width:44px;height:44px;border-radius:8px;font-size:22px;cursor:pointer;box-shadow:0 0 10px rgba(255,153,0,0.35);}
.menu-dropdown{display:none;position:absolute;top:54px;right:0;background:#0f0800;min-width:280px;border:1px solid #ff9900;border-radius:10px;padding:1rem;box-shadow:0 8px 24px rgba(255,153,0,0.2);}
.menu-dropdown.abierto{display:block;}
.menu-dropdown h4{text-align:center;margin-bottom:1rem;color:#ff9900;font-size:1.1rem;border-bottom:1px solid #332200;padding-bottom:0.5rem;}
.menu-opcion{width:100%;padding:1rem;margin:0.3rem 0;background:#1a0e00;color:#ffdd88;border:1px solid #443300;border-radius:8px;text-align:left;cursor:pointer;font-size:1.1rem;}
.menu-opcion:active{background:#2a1800;border-color:#ff9900;color:#ff9900;}

/* TITULO Y HORA */
.titulo-app{text-align:center;margin-top:3.5rem;margin-bottom:0.3rem;}
.titulo-app span{font-size:2.2rem;font-weight:700;text-shadow:0 0 18px currentColor;}
.fecha-hora{text-align:center;margin:0.5rem 0 2rem;}
.saludo{font-size:1rem;font-weight:600;color:#55ffdd;letter-spacing:0.2em;margin-bottom:0.4rem;}
.hora{font-size:3.2rem;font-weight:800;color:#fff;letter-spacing:0.04em;line-height:1;}
.hora-ampm{font-size:2rem;font-weight:800;color:#ffffff;margin-left:0.4rem;vertical-align:middle;}
.fecha{font-size:1.2rem;color:#ffaa55;margin-top:0.6rem;letter-spacing:0.03em;text-align:center;}

/* BOTONES PRINCIPALES */
.contenedor-botones{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:1.2rem;}
.boton{padding:1.4rem;text-align:center;text-decoration:none;font-size:1.4rem;font-weight:500;border-radius:12px;background:#0a0a0a;border:2px solid;box-shadow:0 0 12px currentColor;display:block;transition:transform 0.1s,opacity 0.1s;font-family:'Courier New',monospace;}
.boton:active{transform:scale(0.96);opacity:0.7;}
.rojo{color:#ff5555;border-color:#ff5555;}
.azul{color:#55ddff;border-color:#55ddff;}
.verde{color:#55ff77;border-color:#55ff77;}
.amarillo{color:#ffff55;border-color:#ffff55;}
.morado{color:#dd55ff;border-color:#dd55ff;}
.azul-oscuro{color:#5577ff;border-color:#5577ff;}

/* APARIENCIA */
.panel-apariencia{display:none;position:fixed;top:0;right:0;width:230px;height:auto;max-height:100vh;background:#0f0800;border:1px solid #ff9900;border-bottom-left-radius:12px;padding:1rem 0.8rem;z-index:20000;overflow-y:auto;}
.panel-apariencia h3{text-align:center;color:#ff9900;margin-bottom:0.8rem;font-size:1.1rem;border-bottom:1px solid #332200;padding-bottom:0.5rem;}
.grupo{margin-bottom:0.8rem;}
.grupo h4{margin-bottom:0.3rem;font-size:0.9rem;text-transform:uppercase;font-weight:700;letter-spacing:0.06em;}
#h4Tam{color:#ffdd00;}
#h4Peso{color:#ff9900;}
#h4Estilo{color:#ff6600;}
.opc{width:100%;padding:0.7rem 0.8rem;margin:0.2rem 0;background:#1a0e00;color:#cc9944;border:1px solid #332200;border-radius:4px;cursor:pointer;text-align:left;font-size:1rem;}
.opc.sel{border-color:#ffdd00;background:#1a1200;color:#ffdd00;}
.btn-x{width:100%;padding:0.7rem;margin-top:0.6rem;background:#3a0000;color:#ff4444;border:1px solid #aa1111;border-radius:4px;cursor:pointer;font-size:1rem;font-weight:700;}

/* MODALES */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:21000;align-items:center;justify-content:center;}
.modal.abierto{display:flex;}
.modal-box{background:#0f0800;border:1px solid #ff9900;border-radius:12px;padding:1.5rem;width:88%;max-width:340px;box-shadow:0 0 20px rgba(255,153,0,0.2);}
.modal-box h3{text-align:center;color:#ff9900;margin-bottom:1rem;font-size:1.1rem;}
.modal-box input{width:100%;padding:0.8rem;background:#1a0e00;border:1px solid #443300;border-radius:6px;color:#fff;font-size:1rem;margin-bottom:0.8rem;}
.modal-box input:focus{outline:1px solid #ffdd00;}
.lbl-color{display:block;color:#cc8800;font-size:0.9rem;margin-bottom:0.5rem;font-weight:600;}
.colores-titulo{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;}
.color-btn{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform 0.1s;}
.color-btn.sel{border-color:#ffdd00;transform:scale(1.15);}
.fila-btn{display:flex;gap:0.8rem;}
.btn-ok{flex:1;padding:0.8rem;background:#7a3d00;color:#fff;border:1px solid #ff9900;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:600;}
.btn-no{flex:1;padding:0.8rem;background:#2a0000;color:#ff6666;border:1px solid #661111;border-radius:8px;cursor:pointer;font-size:1rem;}

/* EDITAR ENLACES */
.modal-editar{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:19000;padding:1rem;overflow-y:auto;}
.modal-editar.abierto{display:block;}
.editar-box{max-width:420px;margin:0 auto;background:#0f0800;border-radius:12px;padding:1.2rem;border:1px solid #ff9900;box-shadow:0 0 20px rgba(255,153,0,0.15);}
.editar-box h3{text-align:center;color:#ff9900;margin-bottom:1rem;font-size:1.1rem;}
.campo{margin-bottom:0.8rem;padding:0.8rem;border:1px solid #332200;border-radius:8px;background:#150d00;}
.campo label{display:block;margin-bottom:0.3rem;font-size:1rem;font-weight:600;}
.lbl-nombre{color:#ffdd00;}
.lbl-url{color:#ff9900;}
.campo input{width:100%;padding:0.8rem;background:#1a0e00;border:1px solid #443300;border-radius:5px;color:#fff;margin-bottom:0.4rem;font-size:1rem;}
.campo input:focus{outline:1px solid #ffdd00;}
.btn-del{width:100%;padding:0.7rem;background:#3a0000;color:#ff4444;border:1px solid #881111;border-radius:4px;cursor:pointer;font-size:1rem;font-weight:600;}
.btn-add{width:100%;padding:0.85rem;background:#1a0e00;color:#ff9900;border:1px solid #ff9900;border-radius:8px;cursor:pointer;margin:0.7rem 0;font-size:1rem;font-weight:600;}
.fila-guardar{display:flex;gap:0.8rem;margin-top:1rem;}
.btn-save{flex:1;padding:0.9rem;background:#7a3d00;color:#fff;border:1px solid #ff9900;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:600;}
.btn-cancel{flex:1;padding:0.9rem;background:#2a0000;color:#ff6666;border:1px solid #661111;border-radius:8px;cursor:pointer;font-size:1rem;}

#fileInput{display:none;}
</style>
</head>
<body>

<div id="linternaOverlay"></div>

<div class="menu-container">
  <button id="btnMenu" class="menu-btn" onclick="toggleMenu()">☰</button>
  <div id="menuDrop" class="menu-dropdown">
    <h4>⚙️ Configuración</h4>
    <button class="menu-opcion" onclick="abrirEditar()">✏️ Editar Enlaces</button>
    <button class="menu-opcion" onclick="abrirTitulo()">🏷️ Editar Título</button>
    <button class="menu-opcion" onclick="abrirApariencia()">🎨 Apariencia</button>
    <button class="menu-opcion" onclick="toggleFullscreen()">⛶ Pantalla Completa</button>
    <button class="menu-opcion" onclick="guardarRespaldo()">💾 Guardar Respaldo</button>
    <button class="menu-opcion" onclick="document.getElementById('fileInput').click()">📂 Restaurar Respaldo</button>
    <button class="menu-opcion" onclick="encenderLinterna()">🔦 Linterna</button>
    <input type="file" id="fileInput" accept=".json" onchange="restaurarRespaldo(this)">
  </div>
</div>

<div class="titulo-app"><span id="txtTitulo">Enlaces Mauricio v2</span></div>

<div class="fecha-hora">
  <div id="txtSaludo" class="saludo"></div>
  <div class="hora"><span id="txtHora">--:--</span><span id="txtAmpm" class="hora-ampm">AM</span></div>
  <div id="txtFecha" class="fecha">---</div>
</div>

<div id="listaEnlaces" class="contenedor-botones"></div>

<div id="panelApar" class="panel-apariencia">
  <h3>🎨 Apariencia</h3>
  <div class="grupo" id="grpTam">
    <h4 id="h4Tam">TAMAÑO</h4>
    <button class="opc" onclick="setTam('1.1rem',this)">Pequeño</button>
    <button class="opc sel" onclick="setTam('1.4rem',this)">Normal</button>
    <button class="opc" onclick="setTam('1.7rem',this)">Grande</button>
    <button class="opc" onclick="setTam('2rem',this)">Muy Grande</button>
  </div>
  <div class="grupo" id="grpPeso">
    <h4 id="h4Peso">GROSOR</h4>
    <button class="opc sel" onclick="setPeso('normal',this)">Normal</button>
    <button class="opc" onclick="setPeso('bold',this)">Negrita</button>
    <button class="opc" onclick="setPeso('300',this)">Fina</button>
  </div>
  <div class="grupo" id="grpEstilo">
    <h4 id="h4Estilo">ESTILO</h4>
    <button class="opc sel" onclick="setEstilo('normal',this)">Normal</button>
    <button class="opc" onclick="setEstilo('italic',this)">Cursiva</button>
  </div>
  <button class="btn-x" onclick="cerrarApariencia()">✕ Cerrar</button>
</div>

<div id="modalTitulo" class="modal">
  <div class="modal-box">
    <h3>🏷️ Editar Título</h3>
    <input type="text" id="inputTitulo" maxlength="40" placeholder="Ej: Mis Enlaces">
    <span class="lbl-color">Color del título</span>
    <div class="colores-titulo">
      <button class="color-btn sel" style="background:#00ffff" onclick="setColorTitulo('#00ffff',this)"></button>
      <button class="color-btn" style="background:#ffffff" onclick="setColorTitulo('#ffffff',this)"></button>
      <button class="color-btn" style="background:#ff5555" onclick="setColorTitulo('#ff5555',this)"></button>
      <button class="color-btn" style="background:#ffaa44" onclick="setColorTitulo('#ffaa44',this)"></button>
      <button class="color-btn" style="background:#ffff55" onclick="setColorTitulo('#ffff55',this)"></button>
      <button class="color-btn" style="background:#55ff77" onclick="setColorTitulo('#55ff77',this)"></button>
      <button class="color-btn" style="background:#dd55ff" onclick="setColorTitulo('#dd55ff',this)"></button>
      <button class="color-btn" style="background:#5577ff" onclick="setColorTitulo('#5577ff',this)"></button>
    </div>
    <div class="fila-btn">
      <button class="btn-ok" onclick="guardarTitulo()">Guardar</button>
      <button class="btn-no" onclick="cancelarTitulo()">Cancelar</button>
    </div>
  </div>
</div>

<div id="modalEditar" class="modal-editar">
  <div class="editar-box">
    <h3>✏️ Editar Enlaces</h3>
    <div id="camposEnlaces"></div>
    <button class="btn-add" onclick="agregarCampo('','')">➕ Agregar enlace</button>
    <div class="fila-guardar">
      <button class="btn-save" onclick="guardarEnlaces()">Guardar</button>
      <button class="btn-cancel" onclick="cerrarModal('modalEditar')">Cancelar</button>
    </div>
  </div>
</div>

<script>
var enlaces = [
  {n:'Virus total',    u:'https://www.virustotal.com/gui/home/upload'},
  {n:'Pagalo.pe',      u:'https://pagalo.pe'},
  {n:'Inversor solar', u:'https://autosolar.pe/inversores-solares'},
  {n:'Drive Mauricio', u:'https://drive.google.com/drive/folders/1_2SPHFJYvevPHOgHi3qkn9iKfe60pd85'},
  {n:'Github',         u:'https://github.com/nnilton501peru/Mauricio-'},
  {n:'Ninite pc',      u:'https://ninite.com/?hl=es-PE'}
];
var titulo      = 'Enlaces Mauricio v2';
var colorTitulo = '#00ffff';
var colorPendiente = '#00ffff';
var apariencia  = {tam:'1.4rem', peso:'normal', estilo:'normal'};
var colores     = ['rojo','azul','verde','amarillo','morado','azul-oscuro'];

function guardar() {
  try {
    localStorage.setItem('el_enlaces', JSON.stringify(enlaces));
    localStorage.setItem('el_titulo',  titulo);
    localStorage.setItem('el_color',   colorTitulo);
    localStorage.setItem('el_apar',    JSON.stringify(apariencia));
  } catch(e) {}
}
function cargar() {
  try {
    var e = localStorage.getItem('el_enlaces');
    var t = localStorage.getItem('el_titulo');
    var c = localStorage.getItem('el_color');
    var a = localStorage.getItem('el_apar');
    if (e) enlaces     = JSON.parse(e);
    if (t) titulo      = t;
    if (c) colorTitulo = c;
    if (a) apariencia  = JSON.parse(a);
  } catch(e) {}
  colorPendiente = colorTitulo;
}

/* Escapa caracteres peligrosos para atributos HTML */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

/* Solo acepta http(s), '#' o dominios sin esquema (les pone https://) */
function urlSegura(u) {
  u = String(u == null ? '' : u).trim();
  if (!u || u === '#') return '#';
  if (/^https?:\/\//i.test(u)) return u;
  if (/^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(u)) return 'https://' + u;
  return '#';
}

/* Limpia una lista de enlaces importada */
function enlacesValidos(arr) {
  var out = [];
  for (var i = 0; i < arr.length; i++) {
    var x = arr[i];
    if (x && typeof x.n === 'string' && x.n.trim()) {
      out.push({n: x.n.trim(), u: urlSegura(x.u)});
    }
  }
  return out;
}

function pintarEnlaces() {
  var lista = document.getElementById('listaEnlaces');
  lista.innerHTML = '';
  for (var i = 0; i < enlaces.length; i++) {
    var a = document.createElement('a');
    a.href             = urlSegura(enlaces[i].u);
    a.target           = '_blank';
    a.rel              = 'noopener noreferrer';
    a.className        = 'boton ' + colores[i % colores.length];
    a.textContent      = enlaces[i].n;
    a.style.fontSize   = apariencia.tam;
    a.style.fontWeight = apariencia.peso;
    a.style.fontStyle  = apariencia.estilo;
    lista.appendChild(a);
  }
}

function pintarTitulo() {
  var el = document.getElementById('txtTitulo');
  el.textContent      = titulo;
  el.style.color      = colorTitulo;
  el.style.textShadow = '0 0 18px ' + colorTitulo + '88';
}

function tick() {
  var d    = new Date();
  var raw  = d.getHours();
  var ampm = raw >= 12 ? 'PM' : 'AM';
  var h12  = raw % 12 || 12;
  var h    = String(h12).padStart(2,'0');
  var m    = String(d.getMinutes()).padStart(2,'0');
  var dias  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var saludo = raw < 12 ? 'BUENOS DÍAS ☀️' : (raw < 19 ? 'BUENAS TARDES 🌤️' : 'BUENAS NOCHES 🌙');
  document.getElementById('txtSaludo').textContent = saludo;
  document.getElementById('txtHora').textContent  = h + ':' + m;
  document.getElementById('txtAmpm').textContent  = ampm;
  document.getElementById('txtFecha').textContent = dias[d.getDay()] + ' ' + d.getDate() + ' de ' + meses[d.getMonth()];
}

function restaurarSelApariencia() {
  document.querySelectorAll('#grpTam .opc').forEach(function(b){
    b.className = (b.getAttribute('onclick').indexOf("'"+apariencia.tam+"'") !== -1) ? 'opc sel' : 'opc';
  });
  document.querySelectorAll('#grpPeso .opc').forEach(function(b){
    b.className = (b.getAttribute('onclick').indexOf("'"+apariencia.peso+"'") !== -1) ? 'opc sel' : 'opc';
  });
  document.querySelectorAll('#grpEstilo .opc').forEach(function(b){
    b.className = (b.getAttribute('onclick').indexOf("'"+apariencia.estilo+"'") !== -1) ? 'opc sel' : 'opc';
  });
}

function toggleMenu() {
  var d = document.getElementById('menuDrop');
  d.className = d.className === 'menu-dropdown abierto' ? 'menu-dropdown' : 'menu-dropdown abierto';
}
document.addEventListener('click', function(e) {
  var btn  = document.getElementById('btnMenu');
  var drop = document.getElementById('menuDrop');
  if (!btn.contains(e.target) && !drop.contains(e.target)) {
    drop.className = 'menu-dropdown';
  }
});
function cerrarMenu() {
  document.getElementById('menuDrop').className = 'menu-dropdown';
}

function encenderLinterna() {
  cerrarMenu();
  document.getElementById('linternaOverlay').style.display = 'block';
}
document.getElementById('linternaOverlay').onclick = function() {
  this.style.display = 'none';
};

function toggleFullscreen() {
  cerrarMenu();
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen();
  }
}

function abrirTitulo() {
  cerrarMenu();
  colorPendiente = colorTitulo;
  document.getElementById('inputTitulo').value = titulo;
  document.querySelectorAll('.color-btn').forEach(function(b){
    var oc = b.getAttribute('onclick') || '';
    b.classList.toggle('sel', oc.indexOf("'"+colorTitulo+"'") !== -1);
  });
  document.getElementById('modalTitulo').className = 'modal abierto';
}
function guardarTitulo() {
  var v = document.getElementById('inputTitulo').value.trim();
  if (v) { titulo = v; }
  colorTitulo = colorPendiente;
  pintarTitulo();
  guardar();
  cerrarModal('modalTitulo');
}
/* Cancelar: vuelve el título a como estaba antes de abrir el modal */
function cancelarTitulo() {
  colorPendiente = colorTitulo;
  pintarTitulo();
  cerrarModal('modalTitulo');
}
/* Solo muestra la vista previa; el color se guarda al pulsar Guardar */
function setColorTitulo(color, btn) {
  colorPendiente = color;
  document.querySelectorAll('.color-btn').forEach(function(b){ b.classList.remove('sel'); });
  btn.classList.add('sel');
  var el = document.getElementById('txtTitulo');
  el.style.color      = color;
  el.style.textShadow = '0 0 18px ' + color + '88';
}

function abrirApariencia() {
  cerrarMenu();
  document.getElementById('panelApar').style.display = 'block';
  document.body.style.overflow = 'hidden';
}
function cerrarApariencia() {
  document.getElementById('panelApar').style.display = 'none';
  document.body.style.overflow = '';
}
function setTam(val, btn) {
  apariencia.tam = val;
  document.querySelectorAll('#grpTam .opc').forEach(function(b){ b.className='opc'; });
  btn.className = 'opc sel';
  document.querySelectorAll('.boton').forEach(function(b){ b.style.fontSize = val; });
  guardar();
}
function setPeso(val, btn) {
  apariencia.peso = val;
  document.querySelectorAll('#grpPeso .opc').forEach(function(b){ b.className='opc'; });
  btn.className = 'opc sel';
  document.querySelectorAll('.boton').forEach(function(b){ b.style.fontWeight = val; });
  guardar();
}
function setEstilo(val, btn) {
  apariencia.estilo = val;
  document.querySelectorAll('#grpEstilo .opc').forEach(function(b){ b.className='opc'; });
  btn.className = 'opc sel';
  document.querySelectorAll('.boton').forEach(function(b){ b.style.fontStyle = val; });
  guardar();
}

function abrirEditar() {
  cerrarMenu();
  var cont = document.getElementById('camposEnlaces');
  cont.innerHTML = '';
  for (var i = 0; i < enlaces.length; i++) {
    agregarCampo(enlaces[i].n, enlaces[i].u);
  }
  document.getElementById('modalEditar').className = 'modal-editar abierto';
}
function agregarCampo(nombre, url) {
  var cont = document.getElementById('camposEnlaces');
  var div  = document.createElement('div');
  div.className = 'campo';
  div.innerHTML =
    '<label class="lbl-nombre">Nombre</label>' +
    '<input type="text" class="inp-n" value="' + esc(nombre) + '">' +
    '<label class="lbl-url">URL</label>' +
    '<input type="text" class="inp-u" value="' + esc(url) + '">' +
    '<button class="btn-del">🗑️ Eliminar</button>';
  div.querySelector('.btn-del').onclick = function() {
    var nom = div.querySelector('.inp-n').value || 'este enlace';
    if (confirm('Eliminar "' + nom + '"?')) div.remove();
  };
  cont.appendChild(div);
}
function guardarEnlaces() {
  var campos = document.querySelectorAll('#camposEnlaces .campo');
  var nuevos = [];
  campos.forEach(function(c) {
    var n = c.querySelector('.inp-n').value.trim();
    var u = urlSegura(c.querySelector('.inp-u').value);
    if (n) nuevos.push({n:n, u:u});
  });
  enlaces = nuevos;
  pintarEnlaces();
  guardar();
  cerrarModal('modalEditar');
  alert('Guardado');
}

function guardarRespaldo() {
  cerrarMenu();
  var blob = new Blob([JSON.stringify(enlaces,null,2)], {type:'application/json'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href   = url;
  a.download = 'respaldo_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
function restaurarRespaldo(input) {
  var f = input.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(e) {
    try {
      var datos = JSON.parse(e.target.result);
      var nuevos;
      if (Array.isArray(datos)) {
        nuevos = enlacesValidos(datos);
      } else {
        var tmp = [];
        var i = 0;
        while (datos['n'+i] !== undefined) {
          tmp.push({n:datos['n'+i], u:datos['u'+i]});
          i++;
        }
        nuevos = enlacesValidos(tmp);
      }
      if (nuevos.length === 0) throw new Error('vacio');
      enlaces = nuevos;
      pintarEnlaces();
      guardar();
      alert('Restaurado');
    } catch(err) { alert('Archivo invalido'); }
  };
  r.readAsText(f);
  input.value = '';
}

function cerrarModal(id) {
  var el = document.getElementById(id);
  if (id === 'modalTitulo') {
    el.className = 'modal';
  } else {
    el.className = 'modal-editar';
  }
}

cargar();
pintarTitulo();
pintarEnlaces();
restaurarSelApariencia();
tick();
setInterval(tick, 1000);
</script>
